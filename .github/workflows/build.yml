name: Build

# Publishes ghcr.io/<owner>/<image>-alpine:<version>, :<major> and :<version>-<commit> for arm64 and amd64.
# The weekly run rebuilds on the pinned bases so fixed Alpine packages reach the images without a code change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: postgres-alpine, dir: postgres/18, kind: postgres }
          - { image: postgres-alpine, dir: postgres/16, kind: postgres }
          - { image: caddy-alpine, dir: caddy, kind: caddy }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Version from the base image
        id: v
        run: |
          # the last FROM is the runtime base; earlier ones are build stages
          version=$(sed -nE 's/^FROM [a-z]+:([0-9.]+)-alpine@.*/\1/p' "${{ matrix.dir }}/Dockerfile" | tail -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
      - name: Build for the test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          load: true
          pull: true
          tags: ${{ matrix.image }}:test
      - name: Smoke test
        run: ./test.sh ${{ matrix.kind }} ${{ matrix.image }}:test ${{ steps.v.outputs.version }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          platforms: linux/arm64,linux/amd64
          pull: true
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.major }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
